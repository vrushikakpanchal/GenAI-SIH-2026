<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Summary & Briefing Engine</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    line-height: 1.5;
    background: #f7f7f7;
    color: #222;
  }

  .card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }

  h1 { margin: 0 0 6px; font-size: 28px; }
  .subtitle { color: #666; margin-bottom: 20px; }

  label {
    display: block;
    font-weight: 600;
    margin: 12px 0 6px;
  }

  textarea, select, input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font: inherit;
    background: white;
    color: #222;
  }

  textarea {
    min-height: 220px;
    resize: vertical;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    margin-top: 18px;
    padding: 11px 20px;
    border: 0;
    border-radius: 7px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }

  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #status {
    margin-top: 10px;
    color: #666;
    font-size: 14px;
  }

  #output {
    white-space: pre-wrap;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px;
    background: #fafafa;
    min-height: 120px;
  }

  .hidden { display: none; }

  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 450px) {
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>

<div class="card">
  <h1>Executive Summary & Briefing Engine</h1>
  <div class="subtitle">
    Paste source content or upload a text file, choose your parameters, and generate a structured briefing.
  </div>

  <label for="mode">Input mode</label>
  <select id="mode">
    <option value="text">Paste text</option>
    <option value="file">Upload TXT file</option>
  </select>

  <div id="textInput">
    <label for="content">Source content</label>
    <textarea id="content"
      placeholder="Paste a report, article, advisory, incident summary, meeting notes, etc."></textarea>
  </div>

  <div id="fileInput" class="hidden">
    <label for="file">Source file</label>
    <input type="file" id="file" accept=".txt">
  </div>

  <div class="row">
    <div>
      <label for="audience">Audience</label>
      <select id="audience">
        <option>executive leadership</option>
        <option>board of directors</option>
        <option>technical team</option>
        <option>general public</option>
      </select>
    </div>

    <div>
      <label for="tone">Tone</label>
      <select id="tone">
        <option>formal</option>
        <option>urgent</option>
        <option>neutral</option>
      </select>
    </div>

    <div>
      <label for="detail">Detail level</label>
      <select id="detail">
        <option>brief</option>
        <option selected>concise</option>
        <option>detailed</option>
      </select>
    </div>

    <div>
      <label for="language">Language</label>
      <select id="language">
        <option>English</option>
        <option>Hindi</option>
      </select>
    </div>
  </div>

  <button id="submit">Generate Briefing</button>
  <div id="status"></div>
</div>

<div id="outputWrap" class="card hidden">
  <h2>Executive Briefing</h2>
  <div id="output"></div>
</div>

<script>
const mode = document.getElementById("mode");
const textInput = document.getElementById("textInput");
const fileInput = document.getElementById("fileInput");
const submitBtn = document.getElementById("submit");
const statusEl = document.getElementById("status");
const outputWrap = document.getElementById("outputWrap");
const output = document.getElementById("output");

mode.addEventListener("change", () => {
  const isFile = mode.value === "file";
  textInput.classList.toggle("hidden", isFile);
  fileInput.classList.toggle("hidden", !isFile);
  statusEl.textContent = "";
});

function splitSentences(text) {
  return text
    .replace(/\s+/g, " ")
    .split(/(?<=[.!?])\s+/)
    .map(s => s.trim())
    .filter(Boolean);
}

function makeBriefing(text, params) {
  const sentences = splitSentences(text);

  if (!sentences.length) {
    throw new Error("The source does not contain enough readable text.");
  }

  const maxSentences =
    params.detail === "brief" ? 3 :
    params.detail === "detailed" ? 8 : 5;

  const selected = sentences.slice(0, maxSentences);

  const keyTerms = [
    "important", "key", "risk", "issue", "problem", "impact",
    "result", "increase", "decrease", "need", "recommend",
    "recommendation", "challenge", "opportunity", "security",
    "cost", "revenue", "customer", "project", "deadline"
  ];

  const importantSentences = sentences
    .map(sentence => {
      const lower = sentence.toLowerCase();
      const score = keyTerms.reduce(
        (total, word) => total + (lower.includes(word) ? 1 : 0),
        0
      );
      return { sentence, score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, Math.min(5, sentences.length))
    .map(x => x.sentence);

  const summary = selected.join(" ");

  let briefing = "";

  if (params.language === "Hindi") {
    briefing += "कार्यकारी ब्रीफिंग\n\n";
    briefing += "सारांश:\n" + summary + "\n\n";
    briefing += "मुख्य बिंदु:\n";
    importantSentences.forEach((s, i) => {
      briefing += `${i + 1}. ${s}\n`;
    });
    briefing += `\nश्रोता: ${params.audience}\n`;
    briefing += `टोन: ${params.tone}\n`;
    briefing += `विवरण स्तर: ${params.detail}`;
  } else {
    briefing += "EXECUTIVE BRIEFING\n\n";
    briefing += "EXECUTIVE SUMMARY\n";
    briefing += summary + "\n\n";

    briefing += "KEY POINTS\n";
    importantSentences.forEach((s, i) => {
      briefing += `${i + 1}. ${s}\n`;
    });

    briefing += "\nAUDIENCE\n";
    briefing += params.audience + "\n\n";

    briefing += "TONE\n";
    briefing += params.tone + "\n\n";

    briefing += "DETAIL LEVEL\n";
    briefing += params.detail;
  }

  return briefing;
}

async function getSourceText() {
  if (mode.value === "text") {
    const text = document.getElementById("content").value.trim();

    if (!text) {
      throw new Error("Please paste some source content first.");
    }

    return text;
  }

  const file = document.getElementById("file").files[0];

  if (!file) {
    throw new Error("Please choose a TXT file first.");
  }

  if (!file.name.toLowerCase().endsWith(".txt")) {
    throw new Error("For the browser-only version, please upload a .txt file.");
  }

  return await file.text();
}

submitBtn.addEventListener("click", async () => {
  submitBtn.disabled = true;
  outputWrap.classList.add("hidden");
  statusEl.textContent = "Generating briefing...";

  try {
    const params = {
      audience: document.getElementById("audience").value,
      tone: document.getElementById("tone").value,
      detail: document.getElementById("detail").value,
      language: document.getElementById("language").value
    };

    const sourceText = await getSourceText();

    /*
      IMPORTANT:
      This version works without a backend/API.
      It creates an extractive briefing directly in the browser.

      If you already have a FastAPI backend, you can replace the
      makeBriefing(...) line below with your API call.
    */

    const briefing = makeBriefing(sourceText, params);

    output.textContent = briefing;
    outputWrap.classList.remove("hidden");
    statusEl.textContent = "Briefing generated successfully.";
  } catch (error) {
    console.error(error);
    statusEl.textContent = "Error: " + error.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
